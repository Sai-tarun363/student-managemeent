
<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>
</head>
<body>

    <h1>Update Student Details</h1>

    <form action="/student/update/{{ std[0] }}" method="post">

        Name:
        <input type="text" name="name" value="{{ std[1] }}" required><br><br>

        Age:
        <input type="number" name="age" value="{{ std[2] }}" required><br><br>

        Gender:
        <input type="text" name="gender" value="{{ std[3] }}" required><br><br>

        Marks:
        <input type="number" name="marks" value="{{ std[4] }}" required><br><br>

        Course:
        <input type="text" name="course" value="{{ std[5] }}" required><br><br>

        Status:
        <select name="status">
            <option value="1" {% if std[6] == 1 %}selected{% endif %}>Present</option>
            <option value="0" {% if std[6] == 0 %}selected{% endif %}>Absent</option>
        </select><br><br>

        <button type="submit">Update Student</button>

    </form>

    <a href="/">Back to Home</a>

</body>
</html>
